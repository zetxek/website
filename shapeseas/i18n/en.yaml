## Homepage experience
- id: "experience_title"
  translation: "Experience"

- id: "experience_description"
  translation:
    <p class ="lead">
      I started my career in non-profits, many of which had limited resources to
      build information systems, so data was most often stored in one of three places&#58; 
      spreadsheets saved on someone's desktop locally, paper files locked away in a filing cabinet,
      or the memory of staff.
      <br> Trying to transform these ways of knowing into digital spaces,
      I focused on designing systems that amplify the work of staff and complement the expertise that practioners have built over years of doing their jobs.
      I also ran into the limits of data in education settings. 
      I knew that what was being quantified systematically could become a compressed, flat representation of the work of staff and young people if used for funding, hiring, and decision-making in ways it was not designed for.
      <br> I became interested in understanding the limits of prediction and explanation using data. This drove me to join the <a href="https://css.seas.upenn.edu/">Computational Social Science Lab</a>,
      which unites computer science, statistics, and social science using digital data and platforms
      to study people.
    </p>
