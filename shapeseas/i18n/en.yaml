## Homepage showcase
- id: "showcase_title"
  translation: "Welcome, I'm Eric."

- id: "showcase_subtitle"
  translation: ""

- id: "showcase_description"
  translation:  
   <p class="lead">
      I am a technical project manager and developer based in Philly 
      with 10+ years of experience in non-profit and research settings.
      <br>
      My professional background is primarily in data/operations management, where I build software and create technology strategy to make our jobs easier. Academically, I have studied computer science and social science.
      The focus of my work is&#58;
      <br>1) Developing socio-technical systems to facilitate effective processes
      <br>2) Building open-source projects to advance knowledge infrastructures
      <br>3) Harnessing data to serve people, instead of the other way around

    </p>

