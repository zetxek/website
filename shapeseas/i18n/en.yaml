## Homepage about
- id: "about_title"
  translation: "A bit about me"

- id: "about_content"
  translation:

    <p class="lead">
    I have built and maintained software and data systems in a variety of organizations, 
    working closely with experts and beginners in science/academia, workforce development, and education.
    I have managed research infrastructure using modern development stacks and an agile approach,
    as well as legacy government reporting projects using a careful waterfall approach.
    I believe that successful information systems are built and maintained when we&#58;
    <br>- set clear scope at the start of a project and make iterative edits that snowball over time
    <br>- design software stacks that are calibrated to the organization and its members, not the current tech fads
    <br>- and that in all of this, coding is usually the easiest part
    </p>

- id: "about_button"
  translation: "About Me"

